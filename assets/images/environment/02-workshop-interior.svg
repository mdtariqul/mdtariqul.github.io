<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Inside the embroidery workshop">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5efe8"/><stop offset="1" stop-color="#e3d8cc"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8ab8c"/><stop offset="1" stop-color="#b09274"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#room)"/>
  <rect y="560" width="1200" height="240" fill="url(#floor)"/>
  <rect y="556" width="1200" height="10" fill="#8e745b"/>
  <!-- wall decor / framed designs -->
  <rect x="120" y="110" width="200" height="150" rx="6" fill="#fff" stroke="#c9b8a5" stroke-width="6"/>
  <g transform="translate(220 185)" fill="none" stroke="#9b1b3a" stroke-width="7" stroke-linecap="round">
    <path d="M-50 20 C-60 -50 20 -70 50 -20 C75 25 25 65 -10 40"/>
  </g>
  <rect x="880" y="110" width="200" height="150" rx="6" fill="#fff" stroke="#c9b8a5" stroke-width="6"/>
  <g transform="translate(980 185)" fill="#c9962f">
    <path d="M0 -45 L12 -14 L45 -14 L18 6 L28 38 L0 19 L-28 38 L-18 6 L-45 -14 L-12 -14 Z"/>
  </g>
  <!-- window -->
  <rect x="500" y="90" width="200" height="180" rx="6" fill="#bcd9e8" stroke="#c9b8a5" stroke-width="8"/>
  <path d="M600 90 V270 M500 180 H700" stroke="#fff" stroke-width="5" opacity=".7"/>
  <!-- work tables with machines -->
  <g>
    <rect x="120" y="430" width="420" height="22" rx="5" fill="#8d6b4f"/>
    <rect x="160" y="452" width="16" height="120" fill="#6f5138"/><rect x="484" y="452" width="16" height="120" fill="#6f5138"/>
    <!-- machine 1 -->
    <rect x="200" y="320" width="240" height="110" rx="10" fill="#e9edf0" stroke="#aeb8bf" stroke-width="4"/>
    <rect x="220" y="340" width="90" height="60" rx="5" fill="#5b6770"/>
    <rect x="330" y="345" width="80" height="14" rx="4" fill="#9b1b3a"/>
    <circle cx="410" cy="390" r="18" fill="#9b1b3a"/>
    <rect x="250" y="430" width="160" height="14" rx="3" fill="#4c565e"/>
    <ellipse cx="330" cy="415" rx="70" ry="16" fill="#cfd6db"/>
  </g>
  <g>
    <rect x="660" y="430" width="420" height="22" rx="5" fill="#8d6b4f"/>
    <rect x="700" y="452" width="16" height="120" fill="#6f5138"/><rect x="1024" y="452" width="16" height="120" fill="#6f5138"/>
    <!-- machine 2 -->
    <rect x="740" y="320" width="240" height="110" rx="10" fill="#e9edf0" stroke="#aeb8bf" stroke-width="4"/>
    <rect x="760" y="340" width="90" height="60" rx="5" fill="#5b6770"/>
    <rect x="870" y="345" width="80" height="14" rx="4" fill="#0f766e"/>
    <circle cx="950" cy="390" r="18" fill="#0f766e"/>
    <rect x="790" y="430" width="160" height="14" rx="3" fill="#4c565e"/>
    <ellipse cx="870" cy="415" rx="70" ry="16" fill="#cfd6db"/>
  </g>
  <text x="600" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#5a4f3c">INSIDE OUR WORKSHOP</text>
</svg>
