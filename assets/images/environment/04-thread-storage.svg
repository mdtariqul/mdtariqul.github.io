<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Thread and material storage in the studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efe7"/><stop offset="1" stop-color="#e6d9cb"/></linearGradient>
    <g id="spool">
      <rect x="0" y="0" width="34" height="82" rx="6"/>
      <rect x="0" y="0" width="34" height="10" fill="#e8d9c8"/>
      <rect x="0" y="72" width="34" height="10" fill="#e8d9c8"/>
    </g>
    <g id="fabric">
      <rect x="0" y="20" width="120" height="70" rx="6"/>
      <rect x="0" y="10" width="120" height="14" rx="4" fill="#ffffff" opacity=".28"/>
      <rect x="0" y="0" width="120" height="12" rx="4" fill="#ffffff" opacity=".5"/>
    </g>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- shelving unit -->
  <rect x="120" y="100" width="960" height="540" rx="10" fill="#b8875c" stroke="#8a6040" stroke-width="8"/>
  <rect x="145" y="125" width="910" height="490" fill="#a9794f"/>
  <g fill="#8a6040">
    <rect x="145" y="245" width="910" height="16"/>
    <rect x="145" y="375" width="910" height="16"/>
    <rect x="145" y="505" width="910" height="16"/>
  </g>
  <!-- thread spools -->
  <g transform="translate(180 155)">
    <use href="#spool" x="0" fill="#9b1b3a"/><use href="#spool" x="60" fill="#0f766e"/>
    <use href="#spool" x="120" fill="#2563eb"/><use href="#spool" x="180" fill="#c9962f"/>
    <use href="#spool" x="240" fill="#6d28d9"/><use href="#spool" x="300" fill="#dc2626"/>
    <use href="#spool" x="360" fill="#15803d"/><use href="#spool" x="420" fill="#0891b2"/>
    <use href="#spool" x="480" fill="#db2777"/><use href="#spool" x="540" fill="#ea580c"/>
    <use href="#spool" x="600" fill="#ca8a04"/><use href="#spool" x="660" fill="#0f766e"/>
    <use href="#spool" x="720" fill="#7c3aed"/><use href="#spool" x="780" fill="#9b1b3a"/>
  </g>
  <g transform="translate(180 285)">
    <use href="#spool" x="0" fill="#fbbf24"/><use href="#spool" x="60" fill="#0f766e"/>
    <use href="#spool" x="120" fill="#dc2626"/><use href="#spool" x="180" fill="#7c3aed"/>
    <use href="#spool" x="240" fill="#16a34a"/><use href="#spool" x="300" fill="#0284c7"/>
    <use href="#spool" x="360" fill="#e11d48"/><use href="#spool" x="420" fill="#ca8a04"/>
    <use href="#spool" x="480" fill="#9333ea"/><use href="#spool" x="540" fill="#65a30d"/>
    <use href="#spool" x="600" fill="#0891b2"/><use href="#spool" x="660" fill="#2563eb"/>
    <use href="#spool" x="720" fill="#db2777"/><use href="#spool" x="780" fill="#ea580c"/>
  </g>
  <!-- folded fabric stacks -->
  <g transform="translate(180 415)">
    <use href="#fabric" x="0" fill="#9b1b3a"/><use href="#fabric" x="150" fill="#0f766e"/>
    <use href="#fabric" x="300" fill="#c9962f"/><use href="#fabric" x="450" fill="#6d28d9"/>
    <use href="#fabric" x="600" fill="#15803d"/><use href="#fabric" x="750" fill="#2563eb"/>
  </g>
  <text x="600" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#5a4f3c">THREADS &amp; MATERIALS</text>
  <text x="600" y="758" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" letter-spacing="4" fill="#8a7a68">READY FOR EVERY DESIGN</text>
</svg>
