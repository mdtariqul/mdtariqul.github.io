<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Outside view of the H&N Senile Embroidery studio">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd9ec"/><stop offset="1" stop-color="#e6f1f7"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf6f0"/><stop offset="1" stop-color="#e9ded1"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1030" cy="130" r="60" fill="#ffe6a3"/>
  <!-- clouds -->
  <g fill="#fff" opacity=".85">
    <ellipse cx="220" cy="120" rx="90" ry="26"/><ellipse cx="270" cy="105" rx="55" ry="22"/>
    <ellipse cx="900" cy="210" rx="70" ry="20"/>
  </g>
  <!-- ground -->
  <rect y="600" width="1200" height="200" fill="#c9c2a9"/>
  <rect y="600" width="1200" height="18" fill="#a8a087"/>
  <!-- building -->
  <rect x="250" y="230" width="700" height="370" fill="url(#wall)" stroke="#cfc2b2" stroke-width="3"/>
  <rect x="230" y="205" width="740" height="34" rx="6" fill="#9b1b3a"/>
  <rect x="250" y="240" width="700" height="10" fill="#7d1430"/>
  <!-- sign board -->
  <rect x="430" y="300" width="340" height="86" rx="8" fill="#9b1b3a"/>
  <text x="600" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#fff">H&amp;N SENILE</text>
  <text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="5" fill="#f3d7df">EMBROIDERY</text>
  <!-- windows -->
  <g fill="#7fa8bd" stroke="#cfc2b2" stroke-width="6">
    <rect x="300" y="420" width="130" height="120"/><rect x="770" y="420" width="130" height="120"/>
  </g>
  <g stroke="#fff" stroke-width="3" opacity=".6">
    <path d="M365 420 V540 M300 480 H430 M835 420 V540 M770 480 H900"/>
  </g>
  <!-- door -->
  <rect x="540" y="430" width="120" height="170" rx="4" fill="#3f4a52" stroke="#2b3238" stroke-width="4"/>
  <rect x="556" y="446" width="88" height="70" fill="#6f8595" opacity=".8"/>
  <circle cx="642" cy="525" r="5" fill="#e6b65b"/>
  <!-- plants -->
  <g>
    <rect x="180" y="555" width="34" height="45" rx="4" fill="#b5654a"/>
    <path d="M197 555 C170 520 175 490 197 480 C219 490 224 520 197 555Z" fill="#4f7c46"/>
    <rect x="990" y="555" width="34" height="45" rx="4" fill="#b5654a"/>
    <path d="M1007 555 C980 520 985 490 1007 480 C1029 490 1034 520 1007 555Z" fill="#4f7c46"/>
  </g>
  <text x="600" y="730" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#5a4f3c">OUR STUDIO · VATULIA, TURAG</text>
</svg>
