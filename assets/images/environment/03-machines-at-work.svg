<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Embroidery machines at work">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8eef2"/><stop offset="1" stop-color="#cfd9df"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- machine body -->
  <rect x="100" y="150" width="1000" height="440" rx="24" fill="#f2f5f7" stroke="#aab6bf" stroke-width="6"/>
  <rect x="100" y="150" width="1000" height="70" rx="24" fill="#434e57"/>
  <rect x="140" y="172" width="220" height="26" rx="6" fill="#9b1b3a"/>
  <text x="250" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" letter-spacing="2">COMPUTERIZED EMBROIDERY</text>
  <!-- control screens -->
  <rect x="160" y="260" width="200" height="150" rx="10" fill="#243b4a" stroke="#1a2b36" stroke-width="5"/>
  <rect x="176" y="276" width="168" height="118" rx="4" fill="#3e7d9e"/>
  <path d="M190 360 L230 320 L265 345 L310 295 L335 320" fill="none" stroke="#eaf6fb" stroke-width="3"/>
  <g fill="#9b1b3a"><circle cx="200" cy="440" r="12"/><circle cx="240" cy="440" r="12"/></g>
  <g fill="#e6b65b"><circle cx="280" cy="440" r="12"/><circle cx="320" cy="440" r="12"/></g>
  <!-- needle head -->
  <g transform="translate(760 250)">
    <rect x="0" y="0" width="260" height="190" rx="12" fill="#d7dfe4" stroke="#aab6bf" stroke-width="5"/>
    <g stroke="#6b7882" stroke-width="8" stroke-linecap="round">
      <path d="M40 0 V90"/><path d="M100 0 V90"/><path d="M160 0 V90"/><path d="M220 0 V90"/>
    </g>
    <g stroke="#9b1b3a" stroke-width="4" stroke-linecap="round">
      <path d="M40 90 V130"/><path d="M100 90 V130"/><path d="M160 90 V130"/><path d="M220 90 V130"/>
    </g>
    <!-- hoops -->
    <g fill="none" stroke="#c9962f" stroke-width="10">
      <circle cx="100" cy="160" r="34"/><circle cx="200" cy="160" r="34"/>
    </g>
    <g fill="none" stroke="#9b1b3a" stroke-width="3" stroke-dasharray="1 8" stroke-linecap="round">
      <circle cx="100" cy="160" r="26"/><circle cx="200" cy="160" r="26"/>
    </g>
  </g>
  <!-- table / fabric -->
  <rect x="120" y="590" width="960" height="26" rx="6" fill="#8d6b4f"/>
  <rect x="170" y="616" width="18" height="100" fill="#6f5138"/><rect x="1012" y="616" width="18" height="100" fill="#6f5138"/>
  <rect x="470" y="556" width="280" height="34" rx="6" fill="#9b1b3a" opacity=".85"/>
  <text x="600" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#5a4f3c">MACHINES IN ACTION</text>
</svg>
