<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Sequin embroidery sample">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf3df"/><stop offset="1" stop-color="#f3e1bd"/></linearGradient>
    <radialGradient id="seq" cx="40%" cy="35%"><stop offset="0" stop-color="#fff3cf"/><stop offset=".5" stop-color="#e6b65b"/><stop offset="1" stop-color="#a8761f"/></radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="600" cy="380" r="245" fill="#fffdf7" stroke="#e6d3ae" stroke-width="2"/>
  <circle cx="600" cy="380" r="228" fill="none" stroke="#a98d6a" stroke-width="14"/>
  <circle cx="600" cy="380" r="212" fill="none" stroke="#a8761f" stroke-width="2" stroke-dasharray="1 11" stroke-linecap="round" opacity=".5"/>
  <!-- sequin star burst -->
  <g transform="translate(600 370)" fill="url(#seq)" stroke="#a8761f" stroke-width="1.5">
    <g id="ray"><ellipse cx="0" cy="-130" rx="16" ry="30"/><ellipse cx="0" cy="-85" rx="12" ry="24"/></g>
    <use href="#ray" transform="rotate(45)"/><use href="#ray" transform="rotate(90)"/><use href="#ray" transform="rotate(135)"/>
    <use href="#ray" transform="rotate(180)"/><use href="#ray" transform="rotate(225)"/><use href="#ray" transform="rotate(270)"/><use href="#ray" transform="rotate(315)"/>
    <circle r="40" fill="url(#seq)"/>
    <circle r="20" fill="#fff3cf"/>
  </g>
  <text x="600" y="710" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#8a6418">SEQUIN EMBROIDERY</text>
  <text x="600" y="752" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" letter-spacing="4" fill="#9a8155">SHIMMER · SPARKLE · DIMENSION</text>
</svg>
